# Скопируйте в inventory.yaml и заполните. Не коммитьте боевой файл.
#
# ssh: ключ контроллера должен пускать BatchMode на relay_host (и при необходимости exit).
# Проба всегда с relay_host (там, где висит front IP), не с ноутбука.

cf_token_file: /tmp/cf.token   # или env CF_TOKEN
ssh_key: /home/ubuntu/.ssh/tmpl-audit-temp
state_file: /var/lib/relay-fleet/state.json
probe_tries: 5
probe_timeout_sec: 2
ok_threshold: 3          # минимум успешных TCP из probe_tries чтобы считать путь живым
ports: [443]             # можно добавить 2053
telegram:
  # bot_token_env: TELEGRAM_BOT_TOKEN
  # chat_id_env: TELEGRAM_CHAT_ID
  enabled: false

# failback: false = после flip на backup сам на primary не возвращаем
auto_failback: false

