# Кукузя. HTTP stays open for the raw IP.
# HTTPS is the domain xn--g1afa9ab7e.xn--p1ai (кукузя.рф).
# Certificates come from certbot: /etc/letsencrypt/live/xn--g1afa9ab7e.xn--p1ai/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/misha;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /audio/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name xn--g1afa9ab7e.xn--p1ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/misha;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xn--g1afa9ab7e.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/xn--g1afa9ab7e.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--g1afa9ab7e.xn--p1ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:Kukuzya:10m;

    root /var/www/misha;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /audio/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
