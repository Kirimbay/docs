# Chooser for the letter-A names. Keep these DNS records grey-cloud,
# pointed at this server. Proxied records go through Cloudflare.
server {
    listen 80;
    listen [::]:80;
    server_name a1212.kirvpn.ru a1212.kirvpn.us a14.kirvpn.ru a14.kirvpn.us a15.kirvpn.ru a15.kirvpn.us a20.kirvpn.ru a20.kirvpn.us a36.kirvpn.ru a36.kirvpn.us a37.kirvpn.ru a37.kirvpn.us a51.kirvpn.ru a51.kirvpn.us a54.kirvpn.ru a54.kirvpn.us a57.kirvpn.ru a57.kirvpn.us a57.sarafan.uk a58.kirvpn.ru a58.kirvpn.us a60.kirvpn.ru a60.kirvpn.us a61.kirvpn.ru a61.kirvpn.us abs1.kirvpn.ru abs1.kirvpn.us ahid8.kirvpn.ru ahid8.kirvpn.us;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name a1212.kirvpn.ru a1212.kirvpn.us a14.kirvpn.ru a14.kirvpn.us a15.kirvpn.ru a15.kirvpn.us a20.kirvpn.ru a20.kirvpn.us a36.kirvpn.ru a36.kirvpn.us a37.kirvpn.ru a37.kirvpn.us a51.kirvpn.ru a51.kirvpn.us a54.kirvpn.ru a54.kirvpn.us a57.kirvpn.ru a57.kirvpn.us a57.sarafan.uk a58.kirvpn.ru a58.kirvpn.us a60.kirvpn.ru a60.kirvpn.us a61.kirvpn.ru a61.kirvpn.us abs1.kirvpn.ru abs1.kirvpn.us ahid8.kirvpn.ru ahid8.kirvpn.us;

    ssl_certificate     /etc/letsencrypt/live/a-open/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a-open/privkey.pem;

    # Phones reuse one connection. Gzip makes the reply chunked, and iOS
    # stops reading it after a few page changes. Small TLS records avoid
    # the same stall when a packet is lost.
    ssl_buffer_size 1300;
    sendfile off;
    tcp_nopush off;
    tcp_nodelay on;
    gzip off;
    keepalive_timeout 15s;
    reset_timedout_connection on;
    send_timeout 15s;
    client_header_timeout 15s;
    lingering_timeout 5s;

    root /var/www/a-open;
    charset utf-8;
    access_log /var/log/nginx/a-open.log aopen;

    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /rules-snippet.html {
        internal;
        ssi off;
        default_type text/html;
        root /var/www/a-open;
    }

    location / {
        ssi on;
        ssi_types text/html;
        ssi_silent_errors on;
        default_type text/html;
        try_files /index.html =404;
    }
}
