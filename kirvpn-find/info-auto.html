<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b1220">
  <title>KirVPN — правила</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html { overflow-y: scroll; scrollbar-gutter: stable; }
    html, body { margin: 0; max-width: 100%; overflow-x: hidden; }
    body {
      background: #0b1220;
      color: #e8eefc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      -webkit-text-size-adjust: 100%;
    }
    .wrap {
      width: min(440px, 100%);
      margin: 0 auto;
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
    }
    h1 { font-size: 1.25rem; line-height: 1.2; margin: 4px 0 12px; text-align: center; }
    .site-tabs {
      position: sticky;
      top: 0;
      z-index: 4;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-content: end;
      gap: 8px;
      width: min(440px, 100%);
      height: 62px;
      margin: 0 auto;
      padding: 12px 16px 0;
      background: #0b1220;
      flex: 0 0 auto;
      align-self: center;
    }
    .site-tabs a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 50px;
      min-height: 50px;
      max-height: 50px;
      min-width: 0;
      margin: 0;
      padding: 6px;
      border-radius: 12px;
      border: 1px solid #24324d;
      background: #121b2e;
      color: #c5d4ea;
      font-weight: 700;
      font-size: 0.875rem;
      line-height: 1.15;
      text-align: center;
      text-decoration: none;
      overflow: hidden;
    }
    .site-tabs a.on {
      background: #3a4c68;
      border-color: #d5deec;
      color: #ffffff;
    }
    .apps { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    a.pick {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 168px;
      padding: 18px 10px;
      border-radius: 16px;
      border: 1px solid #24324d;
      background: #121b2e;
      color: #fff;
      font-weight: 700;
      font-size: 1.15rem;
      text-decoration: none;
    }
    a.pick img { width: 84px; height: 84px; border-radius: 18px; display: block; }
    .hint { margin: 12px 0 0; color: #9bb0d0; font-size: 0.92rem; text-align: center; }
    .note { grid-column: 1 / -1; margin: 0; color: #c5d4ea; font-size: 0.92rem; line-height: 1.35; text-align: left; }
    .hint.err { color: #f0a8a8; }
    .foot { margin: 14px 0 0; color: #8aa0c2; font-size: .8rem; text-align: center; }
  </style>
</head>

  <script>
    function arm(id, url, scheme) {
      var link = document.getElementById(id);
      link.addEventListener("click", function (event) {
        if ((link.getAttribute("href") || "").indexOf(scheme) !== 0) event.preventDefault();
      });
      fetch(url, { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("bad");
        return r.text();
      }).then(function (text) {
        text = (text || "").trim();
        if (text.indexOf(scheme) !== 0) throw new Error("bad");
        link.href = text;
      }).catch(function () {
        var st = document.getElementById("st");
        st.className = "hint err";
        st.textContent = "Не получилось загрузить правила. Обнови страницу.";
      });
    }
    arm("happ-rules", "https://routing.sarafan.uk/happ/default.link", "happ://routing/onadd/");
    arm("incy-rules", "https://routing.sarafan.uk/incy/default.link", "incy://routing/onadd/");
  </script>
