server {
    listen 80;
    listen [::]:80;
    server_name info.sarafan.uk;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name info.sarafan.uk;

    ssl_certificate     /etc/letsencrypt/live/info.sarafan.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/info.sarafan.uk/privkey.pem;

    # Phones reuse one connection. Gzip makes the reply chunked, and iOS
    # stops reading it after a few page changes. Small TLS records avoid
    # the same stall when a packet is lost.
    ssl_buffer_size 4k;
    sendfile off;
    tcp_nopush off;
    tcp_nodelay on;
    gzip off;
    keepalive_timeout 15s;
    reset_timedout_connection on;
    send_timeout 15s;
    client_header_timeout 15s;
    lingering_timeout 5s;

    root /var/www/info.sarafan.uk;
    charset utf-8;

    location = /go {
        default_type text/html;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
        alias /var/www/info.sarafan.uk/index.html;
    }
    location = /instrukciya {
        default_type text/html;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
        alias /var/www/info.sarafan.uk/guide.html;
    }
    location = /add-us {
        default_type text/html;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
        alias /var/www/info.sarafan.uk/add-us.html;
    }
    location = /wrap {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18770/wrap;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
    }
    location /s/ {
        proxy_pass http://127.0.0.1:18770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
    }
    location /geo/ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
        try_files $uri $uri/ /index.html;
    }
}
