<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b10" />
  <title>USD · EUR · CNY · BTC</title>
  <meta name="description" content="Курсы доллара, евро, юаня и биткоина." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <main class="board" id="rates-board">
    {% if data %}
      {% for rate in data.sections %}
      <section class="section" id="{{ rate.code|lower }}" data-code="{{ rate.code|lower }}">
        <h2 class="name">{{ rate.name }}</h2>
        <p class="rate" data-role="value">{{ rate.display }}</p>
      </section>
      {% endfor %}
    {% else %}
      <section class="section">
        <p class="rate muted">—.——</p>
      </section>
    {% endif %}
  </main>

  {% if data and data.footer %}
  <footer class="sources" id="sources">
    <p data-role="fiat-source">{{ data.footer.fiat }}</p>
    <p data-role="btc-source">{{ data.footer.btc }}</p>
  </footer>
  {% endif %}

  <script src="/static/app.js" defer></script>
</body>
</html>
