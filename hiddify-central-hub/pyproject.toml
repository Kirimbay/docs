[project]
name = "hiddify-central-hub"
version = "1.0.0"
description = "Central admin hub for multiple Hiddify Manager servers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "cryptography>=42.0.0",
    "click>=8.1.7",
    "apscheduler>=3.10.4",
]

[project.scripts]
hiddify-hub = "hiddify_hub.cli:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
