<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Hiddify Hub — вход</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 4rem auto; padding: 0 1rem; }
    input, button { width: 100%; padding: 0.6rem; margin: 0.4rem 0; box-sizing: border-box; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Hiddify Central Hub</h1>
  <p>Единая админка для всех серверов</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Пароль администратора</label>
    <input type="password" name="password" required autofocus>
    <button type="submit">Войти</button>
  </form>
</body>
</html>
