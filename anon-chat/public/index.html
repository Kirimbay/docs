<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Комната — открытый чат</title>
    <meta name="description" content="Анонимный чат без регистрации: текст и фото." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=11" />
  </head>
  <body>
    <section id="gate" class="gate">
      <div class="gate-inner">
        <p class="brand">Комната</p>
        <h1>Зайдите без регистрации</h1>
        <p class="lede">
          Вам дадут случайное имя — или придумайте своё. Только текст и фото.
        </p>
        <label class="field">
          <span>Имя в чате</span>
          <div class="name-row">
            <input id="name-input" type="text" maxlength="24" autocomplete="nickname" placeholder="Например: Тихий Барс42" />
            <button type="button" id="random-btn" class="ghost">Случайное</button>
          </div>
        </label>
        <button type="button" id="join-btn" class="primary">Войти</button>
        <p id="gate-error" class="error" hidden></p>
      </div>
    </section>

    <div id="app" class="app" hidden>
      <header class="topbar">
        <div class="topbar-brand">
          <span class="brand-mark">Комната</span>
          <span id="presence" class="presence">онлайн —</span>
        </div>
        <div class="topbar-actions">
          <button type="button" id="filter-btn" class="ghost compact" title="Фильтр по участникам">Фильтр</button>
          <button type="button" id="rename-btn" class="ghost compact" title="Сменить имя">Имя</button>
          <button type="button" id="admin-btn" class="ghost compact" title="Админ">Админ</button>
        </div>
      </header>

      <div id="filter-bar" class="filter-bar" hidden>
        <span id="filter-bar-text" class="filter-bar-text">Фильтр</span>
        <button type="button" id="filter-clear-btn" class="ghost compact">Сбросить</button>
      </div>

      <button type="button" id="pins" class="pin-bar" hidden>
        <span class="pin-bar-accent" aria-hidden="true"></span>
        <span class="pin-bar-body">
          <span id="pin-bar-label" class="pin-bar-label">Закреплённое сообщение</span>
          <span id="pin-bar-preview" class="pin-bar-preview"></span>
        </span>
        <span id="pin-bar-meta" class="pin-bar-meta" hidden></span>
      </button>

      <main id="feed" class="feed" aria-live="polite"></main>

      <footer class="composer">
        <div class="composer-shell">
          <div id="reply-bar" class="reply-bar" hidden>
            <span class="reply-bar-accent" aria-hidden="true"></span>
            <span class="reply-bar-body">
              <span id="reply-bar-label" class="reply-bar-label">Ответ</span>
              <span id="reply-bar-preview" class="reply-bar-preview"></span>
            </span>
            <button type="button" id="reply-cancel-btn" class="ghost compact" aria-label="Отменить ответ">×</button>
          </div>
          <div id="preview" class="preview" hidden>
            <img id="preview-img" alt="Превью фото" />
            <button type="button" id="preview-clear" class="ghost compact" aria-label="Убрать фото">×</button>
          </div>
          <div id="emoji-panel" class="emoji-panel" hidden></div>
          <div class="composer-row">
            <label class="attach" title="Прикрепить фото">
              <input id="photo-input" type="file" accept="image/*" hidden />
              <span aria-hidden="true">＋</span>
            </label>
            <button type="button" id="emoji-btn" class="attach" title="Смайлики" aria-label="Смайлики">☺</button>
            <textarea
              id="message-input"
              rows="1"
              maxlength="2000"
              placeholder="Написать сообщение…"
              enterkeyhint="send"
            ></textarea>
            <button type="button" id="send-btn" class="primary compact" aria-label="Отправить">↑</button>
          </div>
        </div>
        <p id="composer-hint" class="hint"></p>
      </footer>
    </div>

    <dialog id="filter-dialog" class="dialog">
      <div class="dialog-body">
        <h2>Фильтр по участникам</h2>
        <p>Отметьте, чьи сообщения показывать. Можно выбрать несколько.</p>
        <div id="filter-user-list" class="user-list"></div>
        <div class="dialog-actions">
          <button type="button" id="filter-cancel-btn" class="ghost">Отмена</button>
          <button type="button" id="filter-apply-btn" class="primary">Показать</button>
        </div>
      </div>
    </dialog>

    <dialog id="admin-dialog" class="dialog">
      <form method="dialog" id="admin-form">
        <h2>Админ</h2>
        <p>Пароль нужен, чтобы закреплять и удалять сообщения.</p>
        <label class="field">
          <span>Пароль</span>
          <input id="admin-password" type="password" autocomplete="current-password" />
        </label>
        <p id="admin-error" class="error" hidden></p>
        <div class="dialog-actions">
          <button type="submit" value="cancel" class="ghost">Отмена</button>
          <button type="submit" value="ok" class="primary" id="admin-submit">Войти</button>
        </div>
      </form>
    </dialog>

    <dialog id="lightbox" class="lightbox">
      <form method="dialog">
        <button type="submit" class="ghost compact lightbox-close" aria-label="Закрыть">×</button>
      </form>
      <img id="lightbox-img" alt="Фото в полном размере" />
    </dialog>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js?v=11"></script>
  </body>
</html>
