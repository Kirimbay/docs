# Nginx local terminator for Komnata chat (HAProxy → this → Node)
server {
    listen 127.0.0.1:__PROXY_PORT__ ssl;
    server_name __CHAT_DOMAIN__;

    ssl_certificate     /etc/ssl/komnata/__CHAT_DOMAIN__.crt;
    ssl_certificate_key /etc/ssl/komnata/__CHAT_DOMAIN__.key;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }
}
