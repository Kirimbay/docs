<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>КвитQR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <header class="top">
    <a class="brand" href="/">КвитQR</a>
  </header>

  <main>
    <section class="hero" id="step-upload">
      <h1 class="brand-hero">КвитQR</h1>
      <p class="lead">Загрузите фото квитанции — QR появится сразу.</p>

      <div class="drop" id="dropzone" role="button" tabindex="0">
        <input id="file-input" type="file" accept="image/*" capture="environment" hidden />
        <span class="drop-title">Перетащите фото или нажмите</span>
        <span class="drop-sub">JPG, PNG · до 12 МБ</span>
      </div>
      <p class="status" id="status" role="status"></p>
    </section>

    <section class="workspace hidden" id="step-edit">
      <div class="workspace-grid">
        <div class="panel-form">
          <h2>Проверьте поля</h2>
          <ul class="hints" id="hints"></ul>

          <form id="fields-form" autocomplete="off">
            <label>Получатель <input name="name" required /></label>
            <label>Счёт получателя <input name="personal_acc" inputmode="numeric" required /></label>
            <label>Банк <input name="bank_name" required /></label>
            <div class="row2">
              <label>БИК <input name="bic" inputmode="numeric" required /></label>
              <label>ЕКС / корсчёт <input name="corresp_acc" inputmode="numeric" required /></label>
            </div>
            <div class="row2">
              <label>ИНН <input name="payee_inn" inputmode="numeric" /></label>
              <label>КПП <input name="kpp" inputmode="numeric" /></label>
            </div>
            <div class="row2">
              <label>КБК <input name="cbc" inputmode="numeric" /></label>
              <label>ОКТМО <input name="oktmo" inputmode="numeric" /></label>
            </div>
            <div class="row2">
              <label>Сумма, ₽ <input name="sum_rub" inputmode="decimal" placeholder="1800" /></label>
              <label>Лицевой счёт <input name="pers_acc" /></label>
            </div>
            <label>Назначение платежа
              <textarea name="purpose" rows="2" placeholder="ФИО и за что платёж"></textarea>
            </label>
            <div class="actions">
              <button type="button" class="btn primary" id="btn-again">Другое фото</button>
            </div>
          </form>
        </div>

        <aside class="panel-qr">
          <h2>QR</h2>
          <div class="qr-frame" id="qr-frame">
            <p class="qr-placeholder">Появится после обработки</p>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div class="progress-overlay hidden" id="progress-overlay" aria-live="polite">
    <div class="progress-card">
      <p class="progress-brand">КвитQR</p>
      <p class="progress-label" id="progress-label">Обработка…</p>
      <div class="progress-track" id="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="progress-pct"><span id="progress-pct">0</span>%</p>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
