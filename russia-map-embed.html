     ИНТЕРАКТИВНАЯ КАРТА РОССИИ — вставьте этот блок целиком

     Чтобы добавить город или поменять видео — измените блок

     ============================================================ -->
<div id="russia-map-widget" class="rmw-root" aria-label="Интерактивная карта России">
  <style>
    #russia-map-widget,
    #russia-map-widget * {
      box-sizing: border-box;
    }

    #russia-map-widget.rmw-root {
      --rmw-bg: #080808;
      --rmw-gold: #d4af37;
      --rmw-gold-soft: #f0d878;
      --rmw-gold-dim: #8a7028;
      --rmw-text: #f5ecd4;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 40%, #14110a 0%, var(--rmw-bg) 68%);
      color: var(--rmw-text);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 16px;
      padding: 20px 16px 24px;
      max-width: 960px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    #russia-map-widget .rmw-title {
      text-align: center;
      font-size: clamp(18px, 2.4vw, 26px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--rmw-gold-soft);
      margin: 0 0 8px;
      font-weight: 600;
    }

    #russia-map-widget .rmw-hint {
      text-align: center;
      font-size: 13px;
      opacity: 0.75;
      margin: 0 0 14px;
    }

    #russia-map-widget .rmw-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1000 / 430;
      min-height: 260px;
    }

    #russia-map-widget .rmw-map-svg {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    #russia-map-widget .rmw-land {
      fill: rgba(212, 175, 55, 0.09);
      stroke: var(--rmw-gold);
      stroke-width: 1.1;
      vector-effect: non-scaling-stroke;
      filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.28));
      transition: fill 0.25s ease, stroke 0.25s ease;
    }

    #russia-map-widget .rmw-land:hover {
      fill: rgba(212, 175, 55, 0.17);
      stroke: var(--rmw-gold-soft);
    }

    #russia-map-widget .rmw-city {
      cursor: pointer;
      outline: none;
    }

    #russia-map-widget .rmw-city-dot {
      fill: var(--rmw-gold);
      stroke: #fff3bf;
      stroke-width: 1.2;
      transition: transform 0.2s ease, fill 0.2s ease;
      transform-origin: center;
      transform-box: fill-box;
    }

    #russia-map-widget .rmw-city:hover .rmw-city-dot,
    #russia-map-widget .rmw-city:focus-visible .rmw-city-dot,
    #russia-map-widget .rmw-city.is-active .rmw-city-dot {
      fill: var(--rmw-gold-soft);
      transform: scale(1.45);
    }

    #russia-map-widget .rmw-city-pulse {
      fill: none;
      stroke: var(--rmw-gold-soft);
      stroke-width: 1;
      opacity: 0;
      pointer-events: none;
    }

    #russia-map-widget .rmw-city:hover .rmw-city-pulse,
    #russia-map-widget .rmw-city:focus-visible .rmw-city-pulse,
    #russia-map-widget .rmw-city.is-active .rmw-city-pulse {
      opacity: 0.75;
      animation: rmw-pulse 1.6s ease-out infinite;
    }

    @keyframes rmw-pulse {
      0% { r: 4; opacity: 0.8; }
      100% { r: 16; opacity: 0; }
    }

    #russia-map-widget .rmw-label {
      position: absolute;
      pointer-events: none;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(8, 8, 8, 0.92);
      border: 1px solid rgba(212, 175, 55, 0.55);
      color: var(--rmw-gold-soft);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, calc(-100% - 14px)) scale(0.96);
      transition: opacity 0.15s ease, transform 0.15s ease;
      z-index: 5;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    #russia-map-widget .rmw-label.is-visible {
      opacity: 1;
      transform: translate(-50%, calc(-100% - 14px)) scale(1);
    }

    #russia-map-widget .rmw-tooltip {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      font-size: 12px;
      opacity: 0.7;
      text-align: center;
      padding: 0 12px;
      pointer-events: none;
    }

    #russia-map-widget .rmw-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999999;
    }

    #russia-map-widget .rmw-modal.is-open {
      display: flex;
    }

    #russia-map-widget .rmw-modal-panel {
      width: min(920px, 100%);
      background: #101010;
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65);
      position: relative;
    }

    #russia-map-widget .rmw-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      color: var(--rmw-gold-soft);
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    #russia-map-widget .rmw-close {
      border: 1px solid rgba(212, 175, 55, 0.45);
      background: transparent;
      color: var(--rmw-gold-soft);
      border-radius: 8px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 0;
    }

    #russia-map-widget .rmw-close:hover {
      background: rgba(212, 175, 55, 0.12);
    }

    #russia-map-widget .rmw-video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    #russia-map-widget .rmw-video-wrap iframe,
    #russia-map-widget .rmw-video-wrap video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    @media (max-width: 640px) {
      #russia-map-widget.rmw-root {
        padding: 14px 10px 18px;
        border-radius: 12px;
      }

      #russia-map-widget .rmw-stage {
        min-height: 210px;
      }
    }
  </style>

  <div class="rmw-modal" id="rmw-video-modal" aria-hidden="true">
    <div class="rmw-modal-panel" role="dialog" aria-modal="true" aria-labelledby="rmw-modal-title">
      <div class="rmw-modal-head">
        <span id="rmw-modal-title">Видео</span>
        <button type="button" class="rmw-close" id="rmw-close-btn" aria-label="Закрыть">&times;</button>
      </div>
      <div class="rmw-video-wrap" id="rmw-video-container"></div>
    </div>
  </div>

  <script>
    (function () {
      var RUSSIA_MAP_CONFIG = {
        cities: {
          moscow: {
            name: "Москва",
            // YouTube: вставьте embed-ссылку вида https://www.youtube.com/embed/ВАШ_ID?autoplay=1
            // MP4: укажите прямую ссылку на файл и videoType: "video"
            videoUrl: "https://www.youtube.com/embed/Scxs7L0vhZ4?autoplay=1&rel=0",
            videoType: "iframe"
          },
          spb: {
            name: "Санкт-Петербург",
            videoUrl: "https://www.youtube.com/embed/1L30rDMeZDs?autoplay=1&rel=0",
            videoType: "iframe"
          }
        }
      };

      var root = document.getElementById("russia-map-widget");
      if (!root) return;

      var stage = root.querySelector(".rmw-stage");
      var label = root.querySelector("#rmw-city-label");
      var modal = root.querySelector("#rmw-video-modal");
      var videoContainer = root.querySelector("#rmw-video-container");
      var modalTitle = root.querySelector("#rmw-modal-title");
      var closeBtn = root.querySelector("#rmw-close-btn");
      var svg = root.querySelector(".rmw-map-svg");
      var activeCity = null;

      function getCityConfig(id) {
        return RUSSIA_MAP_CONFIG.cities[id] || null;
      }

      function clearVideo() {
        videoContainer.innerHTML = "";
      }

      function toEmbedUrl(url) {
        if (!url) return url;
        var ytWatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{11})/i);
        if (ytWatch) {
          return "https://www.youtube.com/embed/" + ytWatch[1] + "?autoplay=1&rel=0";
        }
        return url;
      }

      function buildVideoElement(city) {
        if (!city || !city.videoUrl) {
          var empty = document.createElement("div");
          empty.style.cssText = "display:flex;align-items:center;justify-content:center;height:100%;color:#f0d878;padding:20px;text-align:center;";
          empty.textContent = "Ссылка на видео не задана";
          return empty;
        }

        var url = toEmbedUrl(city.videoUrl);

        if (city.videoType === "video" || /\.(mp4|webm|ogg)(\?|$)/i.test(url)) {
          var video = document.createElement("video");
          video.src = url;
          video.controls = true;
          video.autoplay = true;
          video.playsInline = true;
          return video;
        }

        var iframe = document.createElement("iframe");
        iframe.src = url;
        iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
        iframe.allowFullscreen = true;
        iframe.title = city.name + " — видео";
        return iframe;
      }

      function setActiveCity(node) {
        root.querySelectorAll(".rmw-city").forEach(function (item) {
          item.classList.toggle("is-active", item === node);
        });
        activeCity = node;
      }

      function openVideo(cityId) {
        var city = getCityConfig(cityId);
        if (!city) return;

        clearVideo();
        modalTitle.textContent = city.name;
        videoContainer.appendChild(buildVideoElement(city));
        modal.classList.add("is-open");
        modal.setAttribute("aria-hidden", "false");
        closeBtn.focus();
      }

      function closeVideo() {
        modal.classList.remove("is-open");
        modal.setAttribute("aria-hidden", "true");
        clearVideo();
      }

      function showLabel(cityId, clientX, clientY) {
        var city = getCityConfig(cityId);
        if (!city || !stage) return;

        var rect = stage.getBoundingClientRect();
        var x = clientX - rect.left;
        var y = clientY - rect.top;

        label.textContent = city.name + " — нажмите для видео";
        label.style.left = Math.max(40, Math.min(rect.width - 40, x)) + "px";
        label.style.top = Math.max(20, y) + "px";
        label.classList.add("is-visible");
      }

      function hideLabel() {
        label.classList.remove("is-visible");
      }

      root.querySelectorAll(".rmw-city").forEach(function (node) {
        var cityId = node.getAttribute("data-city-id");

        node.addEventListener("mouseenter", function (e) {
          setActiveCity(node);
          showLabel(cityId, e.clientX, e.clientY);
        });

        node.addEventListener("mousemove", function (e) {
          showLabel(cityId, e.clientX, e.clientY);
        });

        node.addEventListener("mouseleave", function () {
          node.classList.remove("is-active");
          if (activeCity === node) activeCity = null;
          hideLabel();
        });

        node.addEventListener("click", function (e) {
          e.preventDefault();
          openVideo(cityId);
        });

        node.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openVideo(cityId);
          }
        });
      });

      closeBtn.addEventListener("click", closeVideo);

      modal.addEventListener("click", function (e) {
        if (e.target === modal) closeVideo();
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && modal.classList.contains("is-open")) {
          closeVideo();
        }
      });

      if (svg) {
        svg.addEventListener("mouseleave", hideLabel);
      }
    })();
  </script>
</div>
