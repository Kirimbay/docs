    #russia-map-widget,

    #russia-map-widget.rmw-root {
      --rmw-bg: #040404;
      --rmw-gold: #d4af37;
      --rmw-gold-soft: #ffe9a3;
      --rmw-gold-deep: #9a7720;

      margin-right: calc(50% - 50vw);

      left: auto;
      height: 100vh;
      height: 100dvh;
      max-height: 100dvh;
      min-height: 320px;
      overflow: hidden;
      isolation: isolate;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--rmw-text);
      background:
        radial-gradient(ellipse 80% 60% at 50% 55%, rgba(212,175,55,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 120% 80% at 50% 100%, rgba(20,16,8,0.9) 0%, var(--rmw-bg) 55%),
        #030303;
    }

    #russia-map-widget .rmw-water-layer {
      position: absolute;
      inset: -10%;
      pointer-events: none;
      background:
        radial-gradient(circle at 30% 40%, rgba(212,175,55,0.06) 0%, transparent 42%),
        radial-gradient(circle at 70% 60%, rgba(255,220,120,0.05) 0%, transparent 38%);
      animation: rmw-water-drift 14s ease-in-out infinite alternate;
      mix-blend-mode: screen;
      z-index: 1;
    }

    #russia-map-widget .rmw-water-layer-2 {
      animation-duration: 19s;
      animation-direction: alternate-reverse;
      opacity: 0.7;
      background: radial-gradient(circle at 55% 45%, rgba(212,175,55,0.08) 0%, transparent 50%);
    }

    @keyframes rmw-water-drift {
      0% { transform: translate(-1.5%, -1%) scale(1); }
      100% { transform: translate(1.5%, 1.2%) scale(1.03); }
    }

    #russia-map-widget .rmw-header {
      position: relative;
      flex: 0 0 auto;
      padding: clamp(12px, 2.5vh, 28px) 16px clamp(8px, 1.5vh, 16px);
      z-index: 10;
      text-align: center;
      pointer-events: none;
      width: 100%;
    }

    #russia-map-widget .rmw-title {
      margin: 0;
      font-size: clamp(20px, 3vw, 34px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 600;
      background: linear-gradient(90deg, #a8842a, #ffe9a3, #d4af37, #fff3c4, #a8842a);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rmw-shimmer-text 6s linear infinite;
      filter: drop-shadow(0 0 18px rgba(212,175,55,0.35));
    }

    #russia-map-widget .rmw-hint {
      margin: 8px 0 0;
      font-size: clamp(12px, 1.5vw, 14px);
      opacity: 0.72;
    }

    @keyframes rmw-shimmer-text {
      0% { background-position: 0% 50%; }
      100% { background-position: 220% 50%; }
    }

    #russia-map-widget .rmw-stage {
      position: relative;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
      max-height: 100%;
      overflow: hidden;
      z-index: 3;
    }

    #russia-map-widget .rmw-particles {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 6;
    }

    #russia-map-widget .rmw-map-wrap {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 clamp(4px, 1vw, 12px);
    }

    
    #russia-map-widget .rmw-inset-panel {
      position: absolute;
      left: clamp(10px, 2vw, 22px);
      bottom: clamp(10px, 2vh, 18px);
      z-index: 8;
      width: 108px;
      height: 92px;
      padding: 6px 6px 4px;
      border-radius: 10px;
      background: rgba(4,4,4,0.82);
      border: 1px solid rgba(212,175,55,0.35);
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      pointer-events: none;
    }

    #russia-map-widget .rmw-inset-label {
      display: block;
      text-align: center;
      font-size: 9px;
      letter-spacing: 0.08em;
      color: rgba(255,233,163,0.8);
      margin-bottom: 2px;
    }

    #russia-map-widget .rmw-inset-panel svg {
      width: 100%;
      height: 68px;
      display: block;
    }

    #russia-map-widget .rmw-map-svg {
      display: block;
      overflow: visible;
      user-select: none;
      touch-action: manipulation;
      flex: 0 0 auto;
    }

    #russia-map-widget .rmw-land-fill {
      fill: url(#rmw-gold-fill);
      stroke: none;
    }

    #russia-map-widget .rmw-land-stroke {
      fill: none;
      stroke: url(#rmw-shine-stroke);
      stroke-width: var(--rmw-stroke);
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
      paint-order: stroke fill;
    }

    #russia-map-widget .rmw-city {
      cursor: pointer;
      outline: none;
    }

    #russia-map-widget .rmw-city-glow {
      fill: rgba(255, 220, 120, 0.22);
      filter: blur(2px);
      animation: rmw-city-glow 2.4s ease-in-out infinite;
    }

    @keyframes rmw-city-glow {
      0%, 100% { opacity: 0.35; r: 8; }
      50% { opacity: 0.85; r: 13; }
    }

    #russia-map-widget .rmw-city-dot {
      fill: url(#rmw-dot-fill);
      stroke: #fff8d6;
      stroke-width: 1.2;
      filter: drop-shadow(0 0 6px rgba(255, 220, 120, 0.9));
      animation: rmw-dot-pulse 2.2s ease-in-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }

    @keyframes rmw-dot-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }

    #russia-map-widget .rmw-city-pulse {
      fill: none;
      stroke: rgba(255, 230, 150, 0.75);
      stroke-width: 1.2;
      animation: rmw-pulse-ring 2.4s ease-out infinite;
    }

    #russia-map-widget .rmw-city-pulse-2 {
      animation-delay: 1.2s;
    }

    @keyframes rmw-pulse-ring {
      0% { r: 5; opacity: 0.85; }
      100% { r: 22; opacity: 0; }
    }

    #russia-map-widget .rmw-city:hover .rmw-city-dot,
    #russia-map-widget .rmw-city:focus-visible .rmw-city-dot,
    #russia-map-widget .rmw-city.is-active .rmw-city-dot {
      transform: scale(1.45);
      animation: none;
    }

    #russia-map-widget .rmw-label {
      position: absolute;
      pointer-events: none;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(4, 4, 4, 0.88);
      border: 1px solid rgba(212, 175, 55, 0.65);
      color: var(--rmw-gold-soft);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, calc(-100% - 16px)) scale(0.94);
      transition: opacity 0.15s ease, transform 0.15s ease;
      z-index: 12;
      box-shadow: 0 10px 30px rgba(0,0,0,0.55), 0 0 20px rgba(212,175,55,0.15);
    }

    #russia-map-widget .rmw-label.is-visible {
      opacity: 1;
      transform: translate(-50%, calc(-100% - 16px)) scale(1);
    }

    #russia-map-widget .rmw-tooltip {
      position: relative;
      flex: 0 0 auto;
      z-index: 10;
      font-size: clamp(11px, 1.3vw, 13px);
      opacity: 0.55;
      text-align: center;
      padding: clamp(6px, 1vh, 14px) 16px clamp(10px, 1.5vh, 18px);
      pointer-events: none;
      max-width: 100%;
      line-height: 1.4;
    }

    #russia-map-widget .rmw-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: clamp(8px, 2vw, 20px);
      z-index: 999999;
      -webkit-overflow-scrolling: touch;
    }

    #russia-map-widget .rmw-modal::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(
          ellipse min(980px, 94vw) min(680px, 82vh) at 50% 50%,
          rgba(0, 0, 0, 0.08) 0%,
          rgba(0, 0, 0, 0.68) 58%,
          rgba(0, 0, 0, 0.97) 100%
        );
    }

    #russia-map-widget .rmw-modal.is-open { display: flex; }

    @keyframes rmw-shine-border {
      0% { background-position: 0% 50%; }
      100% { background-position: 220% 50%; }
    }

    #russia-map-widget .rmw-modal-frame {
      position: relative;
      z-index: 1;
      width: min(1280px, 96vw);
      max-height: min(96vh, 96dvh);
      padding: var(--rmw-frame-w);
      border-radius: 16px;
      background: linear-gradient(
        90deg,
        #7a6424 0%,
        #7a6424 35%,
        #fff3c4 48%,
        #ffe9a3 52%,
        #fff3c4 56%,
        #7a6424 65%,
        #7a6424 100%
      );
      background-size: 220% 100%;
      animation: rmw-shine-border 18s linear infinite;
      box-shadow:
        0 0 0 1px rgba(212, 175, 55, 0.12),
        0 24px 80px rgba(0,0,0,0.75),
        0 0 48px rgba(212,175,55,0.22);
      filter: drop-shadow(0 0 1px rgba(255, 243, 196, 0.35));
    }

    #russia-map-widget .rmw-modal-panel {
      width: 100%;
      max-height: calc(min(96vh, 96dvh) - (var(--rmw-frame-w) * 2));
      display: flex;
      flex-direction: column;
      background: #0a0a0a;
      border: none;
      border-radius: calc(16px - var(--rmw-frame-w));
      overflow: hidden;
    }

    #russia-map-widget .rmw-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex: 0 0 auto;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      color: var(--rmw-gold-soft);
      font-weight: 600;
      font-size: clamp(15px, 2.5vw, 18px);
    }

    #russia-map-widget .rmw-close {
      border: 1px solid rgba(212, 175, 55, 0.45);
      background: transparent;
      color: var(--rmw-gold-soft);
      border-radius: 8px;
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
      padding: 0;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    #russia-map-widget .rmw-close:hover { background: rgba(212,175,55,0.12); }

    #russia-map-widget .rmw-video-wrap {
      position: relative;
      width: calc(100% - 28px);
      flex: 1 1 auto;
      min-height: 0;
      margin: 0 14px 14px;
      padding: var(--rmw-frame-w);
      border-radius: 10px;
      background: linear-gradient(
        90deg,
        #7a6424 0%,
        #7a6424 35%,
        #fff3c4 48%,
        #ffe9a3 52%,
        #fff3c4 56%,
        #7a6424 65%,
        #7a6424 100%
      );
      background-size: 220% 100%;
      animation: rmw-shine-border 18s linear infinite;
      aspect-ratio: 16 / 9;
      max-height: calc(min(96vh, 96dvh) - 88px);
      filter: drop-shadow(0 0 1px rgba(255, 243, 196, 0.35));
    }

    #russia-map-widget .rmw-video-wrap::before {
      content: "";
      position: absolute;
      inset: var(--rmw-frame-w);
      border-radius: calc(10px - var(--rmw-frame-w));
      background: #000;
      z-index: 0;
      pointer-events: none;
    }

    #russia-map-widget .rmw-video-wrap iframe,
    #russia-map-widget .rmw-video-wrap video {
      position: absolute;
      inset: var(--rmw-frame-w);
      width: calc(100% - (var(--rmw-frame-w) * 2));
      height: calc(100% - (var(--rmw-frame-w) * 2));
      border: 0;
      display: block;
      object-fit: contain;
      background: #000;
      border-radius: calc(10px - var(--rmw-frame-w));
      z-index: 1;
    }

    #russia-map-widget .rmw-city-hit {
      fill: transparent;
      stroke: none;
      pointer-events: all;
    }

    @media (max-width: 640px), (hover: none) and (pointer: coarse) {
      #russia-map-widget .rmw-map-wrap {
        padding: 0 2px;
      }

      #russia-map-widget .rmw-modal {
        padding:
          env(safe-area-inset-top, 0px)
          env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
        align-items: center;
        justify-content: center;
      }

      #russia-map-widget .rmw-modal::before {
        background:
          radial-gradient(
            ellipse 100vw 85vh at 50% 50%,
            rgba(0, 0, 0, 0.12) 0%,
            rgba(0, 0, 0, 0.9) 100%
          );
      }

      #russia-map-widget .rmw-modal-frame {
        width: 100%;
        max-width: 100vw;
        height: auto;
        max-height: 100dvh;
        border-radius: 0;
        padding: var(--rmw-frame-w);
        box-sizing: border-box;
      }

      #russia-map-widget .rmw-modal-panel {
        width: 100%;
        height: auto;
        max-height: none;
        border-radius: 0;
        align-items: center;
      }

      #russia-map-widget .rmw-modal-head {
        width: 100%;
        padding: 10px 12px;
        box-sizing: border-box;
      }

      #russia-map-widget .rmw-video-wrap {
        width: 100%;
        max-width: 100%;
        margin: 0 auto 8px;
        aspect-ratio: 16 / 9;
        flex: 0 0 auto;
        height: auto;
        max-height: none;
        box-sizing: border-box;
      }
    }
  </style>

        </div>

  <script>
    (function () {
      var RUSSIA_MAP_CONFIG = {
        cities: {
          moscow: {
            name: "Москва",
            videoUrl: "https://static.wfolio.ru/file/AqiFFw_TXMM4LDwoI2TPSeEYv7M5masq/kdiGFy2hfRajZlthdu_ie0rqeXhBBEn5/MBVHFo-IUrYh0155SWh4GahmxGpJTCQW/EPn9RSp_IDJLTTnUXj7wAbsAwxskCRch/1B_LRIVqwH8caGW7crztJKtLCU6aTD5w/pZBb6clye34J47NkCBZFRjQKzkcIQ3_D.mp4",
            videoType: "video",
            openOnHover: false
          },
          spb: {
            name: "Санкт-Петербург",
            videoUrl: "https://www.youtube.com/embed/1L30rDMeZDs?autoplay=1&rel=0",
            videoType: "iframe",
            openOnHover: false
          }
        }
      };

      var root = document.getElementById("russia-map-widget");
      if (!root) return;

      function fitMapToStage() {
        var svg = root.querySelector(".rmw-map-svg");
        var stageEl = root.querySelector("#rmw-stage");
        if (!svg || !stageEl) return;
        var vb = svg.viewBox.baseVal;
        if (!vb || !vb.width || !vb.height) return;
        var ar = vb.width / vb.height;
        var pad = 12;
        var sw = stageEl.clientWidth - pad * 2;
        var sh = stageEl.clientHeight - pad * 2;
        if (sw <= 0 || sh <= 0) return;
        var w, h;
        if (sw / sh > ar) {
          h = sh;
          w = h * ar;
        } else {
          w = sw;
          h = w / ar;
        }
        svg.style.width = Math.floor(w) + "px";
        svg.style.height = Math.floor(h) + "px";
      }

      function stretchToViewport() {
        var vh = window.innerHeight || document.documentElement.clientHeight;
        if (vh <= 0) return;

        var rect = root.getBoundingClientRect();
        var available = Math.floor(vh - Math.max(0, rect.top));

        if (available < 280) available = Math.floor(vh * 0.92);

        root.style.height = available + "px";
        root.style.maxHeight = available + "px";
        root.style.minHeight = Math.min(available, 320) + "px";

        fitMapToStage();
      }

      stretchToViewport();
      window.addEventListener("resize", function () {
        stretchToViewport();
        fitVideoModal();
      });
      window.addEventListener("load", stretchToViewport);
      window.addEventListener("orientationchange", function () {
        stretchToViewport();
        setTimeout(fitVideoModal, 120);
      });
      if (window.ResizeObserver) {
        var ro = new ResizeObserver(stretchToViewport);
        ro.observe(root);
      }

      var stage = root.querySelector("#rmw-stage");
      var label = root.querySelector("#rmw-city-label");
      var modal = root.querySelector("#rmw-video-modal");
      var videoContainer = root.querySelector("#rmw-video-container");
      var modalTitle = root.querySelector("#rmw-modal-title");
      var closeBtn = root.querySelector("#rmw-close-btn");
      var canvas = root.querySelector("#rmw-particles");
      var ctx = canvas.getContext("2d");
      var particles = [];
      var activeCity = null;
      var currentVideoCity = null;
      var openedLinkThisHover = {};
      var bodyOverflowBackup = "";
      var prefersHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

      function lockPageScroll() {
        bodyOverflowBackup = document.body.style.overflow;
        document.body.style.overflow = "hidden";
      }

      function unlockPageScroll() {
        document.body.style.overflow = bodyOverflowBackup || "";
      }

      function getCityConfig(id) {
        return RUSSIA_MAP_CONFIG.cities[id] || null;
      }

      function isCompactModal() {
        return window.matchMedia("(max-width: 640px), (hover: none) and (pointer: coarse)").matches;
      }

      function resetVideoWrapSize() {
        var wrap = root.querySelector(".rmw-video-wrap");
        if (!wrap) return;
        wrap.style.width = "";
        wrap.style.height = "";
        wrap.style.maxWidth = "";
        wrap.style.maxHeight = "";
        wrap.style.margin = "";
      }

      function fitVideoModal() {
        var frame = root.querySelector(".rmw-modal-frame");
        var head = root.querySelector(".rmw-modal-head");
        var wrap = root.querySelector(".rmw-video-wrap");
        if (!frame || !head || !wrap) return;

        resetVideoWrapSize();
        if (!isCompactModal() || !modal.classList.contains("is-open")) return;

        var frameStyle = getComputedStyle(frame);
        var padX = parseFloat(frameStyle.paddingLeft) + parseFloat(frameStyle.paddingRight);
        var padY = parseFloat(frameStyle.paddingTop) + parseFloat(frameStyle.paddingBottom);
        var wrapStyle = getComputedStyle(wrap);
        var borderW = parseFloat(wrapStyle.paddingLeft) || 3.9;
        var bottomGap = 8;

        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var headH = head.getBoundingClientRect().height;

        var availW = Math.max(0, vw - padX - borderW * 2);
        var availH = Math.max(0, vh - padY - headH - bottomGap - borderW * 2);
        if (availW <= 0 || availH <= 0) return;

        var ar = 16 / 9;
        var innerW, innerH;
        if (availW / availH > ar) {
          innerH = availH;
          innerW = innerH * ar;
        } else {
          innerW = availW;
          innerH = innerW / ar;
        }

        innerW = Math.floor(innerW);
        innerH = Math.floor(innerH);

        wrap.style.width = (innerW + borderW * 2) + "px";
        wrap.style.height = (innerH + borderW * 2) + "px";
        wrap.style.maxWidth = "100%";
        wrap.style.maxHeight = (innerH + borderW * 2) + "px";
        wrap.style.margin = "0 auto " + bottomGap + "px";
        wrap.style.flex = "0 0 auto";
      }

      function resizeCanvas() {
        if (!stage || !canvas) return;
        var rect = stage.getBoundingClientRect();
        var dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(rect.width * dpr);
        canvas.height = Math.floor(rect.height * dpr);
        canvas.style.width = rect.width + "px";
        canvas.style.height = rect.height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function spawnParticles(x, y, count) {
        for (var i = 0; i < count; i++) {
          particles.push({
            x: x + (Math.random() - 0.5) * 8,
            y: y + (Math.random() - 0.5) * 8,
            vx: (Math.random() - 0.5) * 0.6,
            vy: 0.4 + Math.random() * 1.4,
            life: 1,
            decay: 0.012 + Math.random() * 0.02,
            size: 1 + Math.random() * 2.2,
            hue: 42 + Math.random() * 18
          });
        }
        if (particles.length > 280) particles.splice(0, particles.length - 280);
      }

      function drawParticles() {
        if (!stage) return;
        var w = stage.clientWidth;
        var h = stage.clientHeight;
        ctx.clearRect(0, 0, w, h);
        for (var i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.015;
          p.life -= p.decay;
          if (p.life <= 0) { particles.splice(i, 1); continue; }
          ctx.beginPath();
          ctx.fillStyle = "hsla(" + p.hue + ", 85%, 68%, " + (p.life * 0.85) + ")";
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(drawParticles);
      }

      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
      requestAnimationFrame(drawParticles);

      stage.addEventListener("mousemove", function (e) {
        var rect = stage.getBoundingClientRect();
        spawnParticles(e.clientX - rect.left, e.clientY - rect.top, 3);
      });

      stage.addEventListener("touchmove", function (e) {
        if (!e.touches || !e.touches[0]) return;
        var rect = stage.getBoundingClientRect();
        var t = e.touches[0];
        spawnParticles(t.clientX - rect.left, t.clientY - rect.top, 2);
      }, { passive: true });

      function clearVideo() { videoContainer.innerHTML = ""; }

      function toEmbedUrl(url) {
        if (!url) return url;
        var ytWatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{11})/i);
        if (ytWatch) return "https://www.youtube.com/embed/" + ytWatch[1] + "?autoplay=1&rel=0";
        var vkLink = url.match(/(?:vkvideo\.ru|vk\.com)\/video(-?\d+)_(\d+)/i);
        if (vkLink) {
          var oid = vkLink[1].charAt(0) === "-" ? vkLink[1] : "-" + vkLink[1];
          return "https://vkvideo.ru/video_ext.php?oid=" + oid + "&id=" + vkLink[2] + "&hd=2&autoplay=1";
        }
        return url;
      }

      function buildVideoElement(city) {
        var url = toEmbedUrl(city.videoUrl);
        if (city.videoType === "video" || /\.(mp4|webm|ogg)(\?|$)/i.test(url)) {
          var video = document.createElement("video");
          video.src = url;
          video.controls = true;
          video.autoplay = true;
          video.playsInline = true;
          video.setAttribute("playsinline", "");
          video.setAttribute("webkit-playsinline", "");
          video.preload = "metadata";
          video.title = city.name + " — видео";
          return video;
        }
        var iframe = document.createElement("iframe");
        iframe.src = url;
        iframe.allow = "autoplay; encrypted-media; picture-in-picture; screen-wake-lock; fullscreen";
        iframe.allowFullscreen = true;
        iframe.title = city.name + " — видео";
        return iframe;
      }

      function openCityVideo(cityId) {
        var city = getCityConfig(cityId);
        if (!city || !city.videoUrl) return;
        if (city.openMode === "link") {
          if (openedLinkThisHover[cityId]) return;
          openedLinkThisHover[cityId] = true;
          window.open(city.videoUrl, "_blank", "noopener,noreferrer");
          return;
        }
        openVideo(cityId);
      }

      function openVideo(cityId) {
        var city = getCityConfig(cityId);
        if (!city || !city.videoUrl) return;
        if (currentVideoCity === cityId && modal.classList.contains("is-open")) return;
        clearVideo();
        modalTitle.textContent = city.name;
        videoContainer.appendChild(buildVideoElement(city));
        modal.classList.add("is-open");
        modal.setAttribute("aria-hidden", "false");
        currentVideoCity = cityId;
        lockPageScroll();
        requestAnimationFrame(function () {
          fitVideoModal();
          requestAnimationFrame(fitVideoModal);
        });
      }

      function closeVideo() {
        modal.classList.remove("is-open");
        modal.setAttribute("aria-hidden", "true");
        clearVideo();
        currentVideoCity = null;
        unlockPageScroll();
        resetVideoWrapSize();
      }

      function showLabel(cityId, clientX, clientY) {
        var node = root.querySelector('.rmw-city[data-city-id="' + cityId + '"]');
        var cfg = getCityConfig(cityId);
        var name = (cfg && cfg.name) || (node && node.getAttribute("aria-label")) || cityId;
        var hasVideo = !!(cfg && cfg.videoUrl);
        var videoHint = hasVideo
          ? (cfg.openMode === "link" ? " — открыть видео" : " — нажмите для видео")
          : "";
        var rect = stage.getBoundingClientRect();
        label.textContent = name + videoHint;
        label.style.left = Math.max(50, Math.min(rect.width - 50, clientX - rect.left)) + "px";
        label.style.top = Math.max(24, clientY - rect.top) + "px";
        label.classList.add("is-visible");
      }

      function hideLabel() { label.classList.remove("is-visible"); }

      root.querySelectorAll(".rmw-city").forEach(function (node) {
        var cityId = node.getAttribute("data-city-id");
        var touchMoved = false;

        node.addEventListener("mouseenter", function (e) {
          node.classList.add("is-active");
          showLabel(cityId, e.clientX, e.clientY);
          if (!prefersHover) return;
          var cfg = getCityConfig(cityId);
          if (cfg && cfg.videoUrl && cfg.openOnHover !== false) openCityVideo(cityId);
        });
        node.addEventListener("mousemove", function (e) { showLabel(cityId, e.clientX, e.clientY); });
        node.addEventListener("mouseleave", function () {
          node.classList.remove("is-active");
          hideLabel();
          openedLinkThisHover[cityId] = false;
        });
        node.addEventListener("click", function (e) {
          e.preventDefault();
          openCityVideo(cityId);
        });
        node.addEventListener("touchstart", function () {
          touchMoved = false;
          node.classList.add("is-active");
        }, { passive: true });
        node.addEventListener("touchmove", function () {
          touchMoved = true;
        }, { passive: true });
        node.addEventListener("touchend", function (e) {
          if (touchMoved) {
            node.classList.remove("is-active");
            return;
          }
          e.preventDefault();
          var t = e.changedTouches && e.changedTouches[0];
          if (t) showLabel(cityId, t.clientX, t.clientY);
          openCityVideo(cityId);
        });
        node.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCityVideo(cityId); }
        });
      });

      closeBtn.addEventListener("click", closeVideo);
      modal.addEventListener("click", function (e) { if (e.target === modal) closeVideo(); });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && modal.classList.contains("is-open")) closeVideo();
      });
    })();
  </script>
</div>
